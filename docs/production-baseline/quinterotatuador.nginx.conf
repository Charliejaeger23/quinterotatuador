# quinterotatuador.com — sitio estático (Let's Encrypt via certbot en el host, hooks en /etc/letsencrypt/qram-hooks)
server {
    listen 80;
    listen [::]:80;
    server_name quinterotatuador.com www.quinterotatuador.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quinterotatuador.com www.quinterotatuador.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/quinterotatuador.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quinterotatuador.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/quinterotatuador.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
